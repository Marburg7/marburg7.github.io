    <circle cx="202" cy="16" r="6" fill="#22c55e"/>
  </g>

  <!-- Live Status Box -->
  <rect x="526" y="136" width="212" height="76" rx="12" fill="#151826" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="542" cy="158" r="4.5" fill="#22c55e"/>
  <text x="554" y="162" fill="#22c55e" font-family="monospace" font-size="10.5" font-weight="600">CONTENT PLAYING</text>
  <text x="540" y="182" fill="#f5f3ef" font-family="sans-serif" font-size="11.5" font-weight="600">YouTube · Player Active</text>
  <text x="540" y="199" fill="#a8a49c" font-family="monospace" font-size="9.5">Last Action: Playback Restored</text>

  <!-- Priority Stack Rows -->
  <g transform="translate(526, 228)">
    <text x="0" y="10" fill="#8b8794" font-family="monospace" font-size="9">ACTIVE PROTECTION LAYERS</text>

    <rect y="20" width="212" height="36" rx="9" fill="#141624" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="16" cy="38" r="4" fill="#d4ff3f"/>
    <text x="28" y="35" fill="#f5f3ef" font-family="sans-serif" font-size="11" font-weight="600">Auto-Skip Controls</text>
    <text x="28" y="48" fill="#8b8794" font-family="monospace" font-size="8.5">Skip Intro/Recap excluded</text>

    <rect y="64" width="212" height="36" rx="9" fill="#141624" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="16" cy="82" r="4" fill="#a855f7"/>
    <text x="28" y="79" fill="#f5f3ef" font-family="sans-serif" font-size="11" font-weight="600">DRM-Safe VOD Speed-Up</text>
    <text x="28" y="92" fill="#8b8794" font-family="monospace" font-size="8.5">Live-stream rate protected</text>

    <rect y="108" width="212" height="36" rx="9" fill="#141624" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="16" cy="126" r="4" fill="#f97316"/>
    <text x="28" y="123" fill="#f5f3ef" font-family="sans-serif" font-size="11" font-weight="600">Audio Mute Fallback</text>
    <text x="28" y="136" fill="#8b8794" font-family="monospace" font-size="8.5">Exact volume restored post-ad</text>
  </g>

  <!-- Footer CTA Pill -->
  <rect x="526" y="394" width="212" height="44" rx="12" fill="#f97316" fill-opacity="0.14" stroke="#f97316" stroke-opacity="0.45"/>
  <text x="632" y="414" text-anchor="middle" fill="#ff8c42" font-family="monospace" font-size="10" font-weight="700">VITEST + PLAYWRIGHT TESTED</text>
  <text x="632" y="429" text-anchor="middle" fill="#a8a49c" font-family="monospace" font-size="9">Strict TS · esbuild · Scoped Permissions</text>
</svg>
