<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0c12"/>
      <stop offset="100%" stop-color="#13101d"/>
    </linearGradient>
    <radialGradient id="ss-glow1" cx="76%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ss-glow2" cx="22%" cy="80%" r="44%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ss-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ss-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#d4ff3f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ss-bg)"/>
  <rect width="800" height="500" fill="url(#ss-glow1)"/>
  <rect width="800" height="500" fill="url(#ss-glow2)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Main Streaming Player Window (Left) -->
  <rect x="42" y="64" width="444" height="394" rx="18" fill="#11121a" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Player Video Surface -->
  <rect x="62" y="86" width="404" height="224" rx="12" fill="#090a0f" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Shield Emblem + Headline inside Player Frame -->
  <g transform="translate(80, 106)">
    <rect width="128" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.5"/>
    <circle cx="14" cy="12" r="4" fill="#d4ff3f"/>
    <text x="26" y="16" fill="#e9d5ff" font-family="monospace" font-size="10" font-weight="600">SKIP VERIFIED</text>
  </g>

  <!-- Minimal Shadow-DOM Status Pill (Corner Overlay) -->
  <g transform="translate(310, 106)">
    <rect width="140" height="24" rx="12" fill="#181924" stroke="#f97316" stroke-opacity="0.45"/>
    <circle cx="14" cy="12" r="3.5" fill="#22c55e"/>
    <text x="24" y="16" fill="#f5f3ef" font-family="monospace" font-size="9.5">Shadow-DOM Pill</text>
  </g>

  <text x="80" y="162" fill="#f5f3ef" font-family="sans-serif" font-size="22" font-weight="700">StreamShield</text>
  <text x="80" y="184" fill="#a8a49c" font-family="sans-serif" font-size="12">Universal Video Ad Interruption Manager · Chrome MV3</text>

  <!-- Supported Platform Badges -->
  <g transform="translate(80, 202)">
    <rect width="66" height="22" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="10" y="15" fill="#f5f3ef" font-family="monospace" font-size="9.5">YouTube</text>

    <rect x="74" width="80" height="22" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="84" y="15" fill="#f5f3ef" font-family="monospace" font-size="9.5">JioHotstar</text>

    <rect x="162" width="58" height="22" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="171" y="15" fill="#f5f3ef" font-family="monospace" font-size="9.5">Prime</text>

    <rect x="228" width="64" height="22" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="237" y="15" fill="#f5f3ef" font-family="monospace" font-size="9.5">Netflix</text>

