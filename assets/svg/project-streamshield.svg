  <text x="80" y="350" fill="#a8a49c" font-family="monospace" font-size="10">STRICT TYPESCRIPT · 14-STATE DETERMINISTIC FSM</text>

  <g transform="translate(80, 366)">
    <rect width="114" height="54" rx="10" fill="#141624" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="14" y="25" fill="#d4ff3f" font-family="sans-serif" font-size="16" font-weight="700">9</text>
    <text x="14" y="43" fill="#a8a49c" font-family="monospace" font-size="9.5">Platform Adapters</text>

    <rect x="126" width="114" height="54" rx="10" fill="#141624" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="140" y="25" fill="#ff8c42" font-family="sans-serif" font-size="16" font-weight="700">14-State</text>
    <text x="140" y="43" fill="#a8a49c" font-family="monospace" font-size="9.5">Verified Ad FSM</text>

    <rect x="252" width="116" height="54" rx="10" fill="#141624" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="266" y="25" fill="#22c55e" font-family="sans-serif" font-size="16" font-weight="700">0 Bytes</text>
    <text x="266" y="43" fill="#a8a49c" font-family="monospace" font-size="9.5">Zero Telemetry</text>
  </g>

  <!-- Right Extension Popup Card (Dark-Mode Live Dashboard) -->
  <rect x="506" y="64" width="252" height="394" rx="22" fill="#0e1018" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Popup Header -->
  <g transform="translate(526, 86)">
    <rect width="32" height="32" rx="9" fill="url(#ss-shield)"/>
    <path d="M16 7 L23 10.5 V16 C23 20.5 19.8 23.8 16 25 C12.2 23.8 9 20.5 9 16 V10.5 Z" stroke="#090a0f" stroke-width="2" fill="none"/>
    <text x="42" y="15" fill="#f5f3ef" font-family="sans-serif" font-size="14" font-weight="700">StreamShield</text>
    <text x="42" y="30" fill="#8b8794" font-family="monospace" font-size="9.5">MV3 · v1.0.0</text>
    <!-- Active Toggle Pill -->
