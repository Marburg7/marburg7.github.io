    <text x="308" y="15" fill="#ff8c42" font-family="monospace" font-size="9.5">+5 More</text>
  </g>

  <!-- Player Progress Timeline with Ad Break Markers -->
  <g transform="translate(80, 250)">
    <text x="0" y="10" fill="#8b8794" font-family="monospace" font-size="9.5">AD INTERRUPTION LIFECYCLE · RESTORE VOLUME &amp; RATE</text>
    <rect y="22" width="368" height="8" rx="4" fill="#1e2030"/>
    <rect y="22" width="218" height="8" rx="4" fill="url(#ss-bar)"/>
    <!-- Ad Pod Segments -->
    <rect x="92" y="20" width="18" height="12" rx="3" fill="#a855f7" stroke="#090a0f" stroke-width="1.5"/>
    <rect x="206" y="20" width="22" height="12" rx="3" fill="#f97316" stroke="#090a0f" stroke-width="1.5"/>
    <circle cx="218" cy="26" r="5" fill="#d4ff3f"/>
    <text x="0" y="48" fill="#706c66" font-family="monospace" font-size="9.5">SKIP ACCESSIBLE CONTROLS  →  SAFE VOD SPEED-UP  →  MUTE FALLBACK</text>
